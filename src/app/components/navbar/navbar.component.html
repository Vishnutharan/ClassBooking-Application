<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-left">
      <button type="button" class="logo" (click)="navigateToHome()" aria-label="Go to your dashboard">
        <span class="logo-icon" aria-hidden="true">CB</span><span class="logo-text">ClassBooking</span>
      </button>
      <form class="search-bar" *ngIf="currentUser?.role === 'Student'" (ngSubmit)="onSearch()">
        <span class="search-icon" aria-hidden="true">Search</span>
        <input type="search" name="teacherSearch" aria-label="Search teachers by name or subject"
          placeholder="Search teachers or subjects" [(ngModel)]="searchQuery" />
        <button type="submit" class="search-submit" [disabled]="!searchQuery.trim()">Search</button>
      </form>
    </div>
    <div class="navbar-right">
      <button type="button" class="icon-btn" (click)="toggleTheme()" [attr.aria-pressed]="isDarkMode"
        [attr.aria-label]="isDarkMode ? 'Switch to light theme' : 'Switch to dark theme'" title="Toggle theme">
        {{ isDarkMode ? 'Light' : 'Dark' }}
      </button>
      <div class="notification-wrapper">
        <button type="button" class="icon-btn notification-btn" (click)="toggleNotifications()"
          [attr.aria-expanded]="showNotifications" aria-label="Notifications">Notifications</button>
        <div class="dropdown notifications-dropdown" *ngIf="showNotifications" role="region" aria-label="Notifications">
          <div class="dropdown-header"><h3>Notifications</h3></div>
          <div class="notifications-list"><p class="empty-state">No new notifications</p></div>
        </div>
      </div>
      <div class="user-wrapper" *ngIf="currentUser">
        <button type="button" class="user-btn" (click)="toggleUserMenu()" [attr.aria-expanded]="showUserMenu" aria-label="Open user menu">
          <span class="user-avatar initials" aria-hidden="true">{{ currentUser.fullName.charAt(0).toUpperCase() }}</span>
          <span class="user-info"><span class="user-name">{{ currentUser.fullName }}</span><span class="user-role">{{ currentUser.role }}</span></span>
          <span class="dropdown-arrow" aria-hidden="true">{{ showUserMenu ? 'Close' : 'Menu' }}</span>
        </button>
        <div class="dropdown user-dropdown" *ngIf="showUserMenu">
          <button *ngIf="currentUser.role !== 'Admin'" type="button" class="dropdown-item" (click)="navigate('/manage-profile')">My Profile</button>
          <button *ngIf="currentUser.role === 'Admin'" type="button" class="dropdown-item" (click)="navigate('/admin/settings')">Settings</button>
          <button type="button" class="dropdown-item logout" (click)="logout()">Log out</button>
        </div>
      </div>
    </div>
  </div>
</nav>
